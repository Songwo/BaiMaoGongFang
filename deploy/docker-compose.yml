# 白帽工坊 · 部署编排
# 数据层采用目标态 PostgreSQL + Redis（重构 P3 起代码接入 PG）。
# 注意：api 仍依赖 Mongo/MySQL（P3 迁移前），故 api/web 服务在 P3/P7 完成后方可真正启动；
#       在此之前可单独启动基础设施： docker compose up -d postgres redis
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bmgf}
      POSTGRES_USER: ${POSTGRES_USER:-bmgf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bmgf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 设置 ADMIN_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      DOCKER_HOST: ${DOCKER_HOST:-tcp://host.docker.internal:2375}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      # P3 起接入 PostgreSQL（数据源占位，迁移后启用）
      # SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bmgf}
      # SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bmgf}
      # SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ../apps/web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
