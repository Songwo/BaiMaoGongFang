spring.application.name=bmgf-sandbox
spring.main.banner-mode=off
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${SANDBOX_PORT:8081}

# ================= PostgreSQL（沙箱自有库）=================
spring.datasource.url=${SANDBOX_POSTGRES_URL:jdbc:postgresql://localhost:5432/bmgf_sandbox}
spring.datasource.username=${SANDBOX_POSTGRES_USER:bmgf}
spring.datasource.password=${SANDBOX_POSTGRES_PASSWORD:bmgf}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ================= Docker（靶场容器）=================
sandbox.docker.host=${DOCKER_HOST:tcp://localhost:2375}

# ================= 主应用回调地址（反查题目/更新用户实验）=================
sandbox.api.base-url=${API_BASE_URL:http://localhost:8080}

# ================= JWT（与主应用同密钥，校验同一 token）=================
jwt.secret=${JWT_SECRET}

# ================= 靶场动态建库的 MySQL（凭据外部化）=================
sandbox.lab-mysql.url=${LAB_MYSQL_URL:jdbc:mysql://localhost:3306/?useSSL=false&serverTimezone=UTC}
sandbox.lab-mysql.username=${LAB_MYSQL_USERNAME:root}
sandbox.lab-mysql.password=${LAB_MYSQL_PASSWORD}

# ================= Actuator =================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
