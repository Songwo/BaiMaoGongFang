spring.application.name=bmgf
spring.main.banner-mode=off
# 激活的 profile（默认 dev，生产由环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖）
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# server.port=5002

# ================= MongoDB?? =================
spring.data.mongodb.auto-index-creation=true

# ================= ???? =================
logging.level.root=INFO
# 各环境差异化日志见 application-dev.properties / application-prod.properties

# ================= ???? =================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# ================= ?????? =================
storage.media.video.location=./uploads/videos
storage.media.avatar.location=./uploads/avatars
storage.media.post.location=./uploads/posts
storage.media.feedback.location=./uploads/feedback
storage.static.resources=classpath:/static/

# ================= ????? =================
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}
admin.Id=${ADMIN_ID:}

# ================= ???????? =================
access.media.video.url=/media/videos/**
access.media.avatar.url=/profile/avatars/**

# ================= ?????? =================
spring.task.execution.enabled=false

# ================= ??????MySQL? =================
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/bmgf}
spring.datasource.username=${POSTGRES_USER:bmgf}
spring.datasource.password=${POSTGRES_PASSWORD:bmgf}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA：Schema 由 Flyway 管理，Hibernate 仅做校验
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 关闭 persist 期实体级 Bean Validation（保全 Mongo 时代行为；请求层 @Valid 不受影响）
spring.jpa.properties.jakarta.persistence.validation.mode=none
# Flyway 迁移脚本位置（迁移脚本随各模块切片逐步加入）
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ================= ?????? =================
spring.mail.host=${MAIL_HOST:smtp.qq.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ================= ?????? =================
frontend.url=http://www.wacyg.fun/verify-email?token=
# frontend.url=http://localhost:5173/verify-email?token=

# ================= ?? Logo ? =================
bmgf.logo.url=${BMGF_LOGO_URL:https://www.wacyg.fun/avatar/6a103249-10fc-422d-883a-c5cf4bca4364_%E4%BF%A1%E6%81%AF.png}

# ================= JWT（密钥从环境变量注入，禁止硬编码） =================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================= CORS 允许的源（逗号分隔；生产源放入 .env） =================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080}

# ================= Actuator 健康检查（仅暴露 health/info） =================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
